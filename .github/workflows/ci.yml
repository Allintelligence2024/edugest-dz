name: CI — EduGest DZ

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "CI — EduGest DZ / backend"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       edugestdz_test
          POSTGRES_USER:     edugest_user
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-postgres-pwd' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: edugestdz/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_pgsql, intl, gd, xml, json, fileinfo, redis, zip
          coverage: xdebug
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('edugestdz/backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Setup environment
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-postgres-pwd' }}
        run: |
          cp .env.example .env
          sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|"      .env
          sed -i "s|^DB_HOST=.*|DB_HOST=127.0.0.1|"             .env
          sed -i "s|^DB_PORT=.*|DB_PORT=5432|"                   .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=edugestdz_test|" .env
          sed -i "s|^DB_USERNAME=.*|DB_USERNAME=edugest_user|"   .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${CI_DB_PASSWORD}|"     .env
          sed -i "s|^QR_SIGNING_KEY=.*|QR_SIGNING_KEY=$(openssl rand -hex 32)|"   .env
          sed -i "s|^AUDIT_CHAIN_KEY=.*|AUDIT_CHAIN_KEY=$(openssl rand -hex 32)|" .env
          sed -i "s|^CRON_SECRET=.*|CRON_SECRET=$(openssl rand -hex 32)|"         .env
          sed -i "s|^REDIS_HOST=.*|REDIS_HOST=127.0.0.1|"       .env
          echo "SENTRY_DSN="        >> .env
          echo "TELEGRAM_BOT_TOKEN=" >> .env
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Run migrations
        run: php artisan migrate --seed --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST:       127.0.0.1
          DB_PORT:       5432
          DB_DATABASE:   edugestdz_test
          DB_USERNAME:   edugest_user
          DB_PASSWORD:   ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-postgres-pwd' }}
          REDIS_HOST:    127.0.0.1

      - name: Run tests
        run: php -d memory_limit=512M artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST:       127.0.0.1
          DB_PORT:       5432
          DB_DATABASE:   edugestdz_test
          DB_USERNAME:   edugest_user
          DB_PASSWORD:   ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-postgres-pwd' }}
          REDIS_HOST:    127.0.0.1

      # ── Gardes sécurité (Sprint 3) ────────────────────────────────
      # Bloquants : une régression sur l'isolation tenant ou sur la chaîne
      # d'audit ne doit jamais atteindre la branche principale.

      - name: "Sécurité — RLS actif sur toutes les tables attendues"
        run: php artisan rls:status --strict
        env:
          DB_CONNECTION: pgsql
          DB_HOST:       127.0.0.1
          DB_PORT:       5432
          DB_DATABASE:   edugestdz_test
          DB_USERNAME:   edugest_user
          DB_PASSWORD:   ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-postgres-pwd' }}
          REDIS_HOST:    127.0.0.1

      - name: "Sécurité — intégrité de la chaîne d'audit"
        run: php artisan audit:verify
        env:
          DB_CONNECTION: pgsql
          DB_HOST:       127.0.0.1
          DB_PORT:       5432
          DB_DATABASE:   edugestdz_test
          DB_USERNAME:   edugest_user
          DB_PASSWORD:   ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-postgres-pwd' }}
          REDIS_HOST:    127.0.0.1

      - name: "Sécurité — aucun jeton en localStorage"
        run: |
          # Le jeton d'accès vit en mémoire, le refresh dans un cookie httpOnly.
          # Toute réintroduction de localStorage pour un jeton est une régression.
          if grep -rnE "(local|session)Storage\.(get|set)Item\(\s*['\"](access_token|refresh_token)" \
               frontend/src mobile/src 2>/dev/null \
               | grep -vE "^\S+: *(\*|//|#)"; then
            echo "::error::Jeton d'authentification stocké dans localStorage/sessionStorage"
            exit 1
          fi
          echo "OK — aucun jeton persisté côté navigateur"
        working-directory: edugestdz

      - name: "Sécurité — aucun secret en dur"
        run: |
          # Filet contre la réintroduction de mots de passe littéraux.
          if grep -rnE "EduGest@[0-9]{4}" --include="*.yml" --include="*.yaml" \
               --include="*.php" --include="*.env*" . 2>/dev/null \
               | grep -vE "(vendor/|node_modules/|/tests/|docs/ci-secrets.patch)"; then
            echo "::error::Mot de passe en dur détecté"
            exit 1
          fi
          echo "OK — aucun secret littéral"
        working-directory: .

      - name: Run tests with coverage
        continue-on-error: true
        run: |
          php -d memory_limit=512M artisan test \
            --coverage --min=45 --coverage-clover=coverage-clover.xml 2>&1 \
            | tee coverage-out.txt
        env:
          DB_CONNECTION: pgsql
          DB_HOST:       127.0.0.1
          DB_PORT:       5432
          DB_DATABASE:   edugestdz_test
          DB_USERNAME:   edugest_user
          DB_PASSWORD:   ${{ secrets.CI_DB_PASSWORD || 'ci-ephemeral-postgres-pwd' }}
          REDIS_HOST:    127.0.0.1
          XDEBUG_MODE:   coverage

      - name: "Couverture — verdict"
        if: always()
        run: |
          publier() {
            local N=0
            for ((i=0; i<${#1}; i+=220)); do
              N=$((N+1))
              echo "::error::$2 couverture_$N :: ${1:i:220}"
            done
          }

          echo "## Couverture du backend" >> "$GITHUB_STEP_SUMMARY"

          COUV=""
          if [ -f coverage-clover.xml ] && command -v php >/dev/null 2>&1; then
            COUV=$(php -r '
              $n = simplexml_load_file("coverage-clover.xml");
              $totaux = $n->project->metrics
                ? $n->project->metrics
                : (isset($n->metrics) ? $n->metrics : $n->xpath("//metrics")[0]);
              $couv = (float) $totaux["coveredstatements"];
              $all  = (float) $totaux["statements"];
              $all > 0
                ? printf("%.2f", $couv * 100 / $all)
                : print "0.00";
            ')
          fi

          if [ -n "$COUV" ] && [ "$COUV" != "0.00" ] && [ -f coverage-out.txt ]; then
            LIGNE=$(grep -oiE "^(lines|line coverage)[^%]*[0-9]+\.[0-9]+ ?%" coverage-out.txt | tail -1 || true)
            echo "Lignes couvertes : ${COUV} % (obj. Sprint 4 : 45 %, rapport texte : ${LIGNE:-inconnue})." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::error::couverture_clover :: ${COUV}% (objectif Sprint 4 : 45%)"
            echo "::error::couverture_texte :: $(echo "${LIGNE:-rapport non reconnu}" | tr ':' ' ')"
            exit 0
          fi

          # Aucun pourcentage agrégé exploitable : publier la collecte brute,
          # morceau par morceau, plutôt que d'inventer un chiffre.
          echo "Couverture : NON MESURÉE (format non reconnu). Détail :" >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-clover.xml ]; then
            publier "$(head -c 1500 coverage-clover.xml)"
          else
            publier "$(tail -40 coverage-out.txt 2>/dev/null | head -c 1500)"
          fi

  frontend:
    name: "CI — EduGest DZ / frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edugestdz/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: edugestdz/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (non bloquant)
        continue-on-error: true
        run: npm run lint

      - name: Tests avec couverture (cliquet bloquant)
        run: npm run test:coverage
        env:
          CI: true

      - name: Build
        run: npm run build

  qualite:
    name: "CI — EduGest DZ / qualité"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl
          tools: composer:v2

      - name: "Audit des dépendances PHP (composer audit) — non bloquant : advisories laravel/framework 11.31 à résoudre par composer update (voir dette Lot A)"
        continue-on-error: true
        working-directory: edugestdz/backend
        run: composer audit --no-interaction

      - name: Audit des dépendances npm du frontend (bloquant)
        working-directory: edugestdz/frontend
        run: npm audit --audit-level=high

      - name: Audit des dépendances npm du mobile (non bloquant)
        if: always()
        working-directory: edugestdz/mobile
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Gitleaks — détection de secrets commités
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git || true
        continue-on-error: true

      - name: Analyse statique backend (PHPStan niveau 6, non bloquant sans baseline)
        if: always()
        working-directory: edugestdz/backend
        continue-on-error: true
        run: ../../scripts/analyse-statique.sh --no-progress

      - name: Génération de la baseline PHPStan (une fois, hors baseline)
        if: ${{ hashFiles('edugestdz/backend/phpstan-baseline.neon') == '' }}
        working-directory: edugestdz/backend
        run: |
          if [ -f phpstan-baseline.neon ]; then
            echo "La baseline existe déjà — rien à faire."
            exit 0
          fi
          if [ ! -f vendor/bin/phpstan ]; then
            echo "PHPStan absent — installe d'abord (step analyse non bloquant)."
            exit 0
          fi
          CONFIG="$(mktemp phpstan-XXXXXX.neon)"
          trap 'rm -f "${CONFIG}"' EXIT
          {
            printf 'includes:\n    - vendor/larastan/larastan/extension.neon\n\n'
            cat phpstan.neon
          } > "${CONFIG}"
          php -d memory_limit=1G vendor/bin/phpstan analyse \
            --configuration="${CONFIG}" \
            --no-progress \
            --generate-baseline || true
          if [ ! -f phpstan-baseline.neon ]; then
            echo "Aucune baseline générée (peu probable à PHPStan niveau 6)."
          fi

      - name: Upload de la baseline PHPStan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-baseline
          path: edugestdz/backend/phpstan-baseline.neon
          if-no-files-found: warn
