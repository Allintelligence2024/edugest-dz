name: CI — EduGest DZ

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "CI — EduGest DZ / backend"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       edugestdz_test
          POSTGRES_USER:     edugest_user
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'EduGest_CI_2026' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      meilisearch:
        image: getmeili/meilisearch:v1.8
        ports:
          - 7700:7700
        env:
          MEILI_MASTER_KEY: test_master_key_ci_2026
          MEILI_ENV: development
        options: >-
          --health-cmd "curl -f http://localhost:7700/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: edugestdz/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_pgsql, intl, gd, xml, json, fileinfo, redis, zip
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('edugestdz/backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i "s|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|"      .env
          sed -i "s|^DB_HOST=.*|DB_HOST=127.0.0.1|"             .env
          sed -i "s|^DB_PORT=.*|DB_PORT=5432|"                   .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=edugestdz_test|" .env
          sed -i "s|^DB_USERNAME=.*|DB_USERNAME=edugest_user|"   .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${TEST_DB_PASS}|" .env
          sed -i "s|^REDIS_HOST=.*|REDIS_HOST=127.0.0.1|"       .env
          echo "SENTRY_DSN="        >> .env
          echo "TELEGRAM_BOT_TOKEN=" >> .env
          php artisan key:generate
          php artisan jwt:secret --force
        env:
          TEST_DB_PASS: ${{ secrets.TEST_DB_PASSWORD || 'EduGest_CI_2026' }}

      - name: Run migrations
        run: php artisan migrate --seed --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST:       127.0.0.1
          DB_PORT:       5432
          DB_DATABASE:   edugestdz_test
          DB_USERNAME:   edugest_user
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'EduGest_CI_2026' }}
          REDIS_HOST:    127.0.0.1

      - name: Run tests
        run: php -d memory_limit=512M artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST:       127.0.0.1
          DB_PORT:       5432
          DB_DATABASE:   edugestdz_test
          DB_USERNAME:   edugest_user
          DB_PASSWORD:   ${{ secrets.TEST_DB_PASSWORD || 'EduGest_CI_2026' }}
          REDIS_HOST:    127.0.0.1
          MEILISEARCH_HOST: http://localhost:7700
          MEILISEARCH_KEY:  test_master_key_ci_2026
          SCOUT_DRIVER:     meilisearch

  mobile-tests:
    name: "CI — EduGest DZ / mobile"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edugestdz/mobile

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: edugestdz/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test -- --passWithNoTests --forceExit
