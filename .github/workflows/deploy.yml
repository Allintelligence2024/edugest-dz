name: CD — Deploy Production (VPS · DÉSACTIVÉ)

# ─────────────────────────────────────────────────────────────────────────────
# DÉSACTIVÉ le 2026-09-07.
#
# Le déploiement cible est désormais Vercel (frontend + backend serverless PHP),
# géré par l'intégration Git de Vercel — pas par GitHub Actions.
# Railway a été abandonné.
#
# Ce workflow (déploiement SSH vers un VPS Docker) est conservé en
# déclenchement MANUEL uniquement, comme filet de secours tant que la cible
# serverless n'est pas validée en production. Il ne se déclenche plus sur push.
#
# Pour le réactiver automatiquement : restaurer le bloc `push:` ci-dessous.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: "Taper 'deployer' pour confirmer le déploiement VPS"
        required: true
        default: ''

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # ⚠️ Ne déploie QUE si le CI backend passe
    needs: []

    if: github.event.inputs.confirmer == 'deployer'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          port:     ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ~/edugest-dz

            echo "📥 Pull des dernières modifications..."
            git pull origin main

            cd edugestdz

            echo "🚀 Déploiement..."
            chmod +x deploy.sh
            ./deploy.sh

            echo "✅ Déploiement terminé — $(date)"
